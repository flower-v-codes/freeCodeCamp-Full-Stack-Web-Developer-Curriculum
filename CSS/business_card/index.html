<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Business Card</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="business-card">
      <img
        class="profile-image"
        src="https://cdn.freecodecamp.org/curriculum/labs/flower.jpg"
        alt="a single flower with a red center and pink blossoms"
      />
      <p class="full-name">Virag</p>
      <p class="designation">Full-Stack Web Developer</p>
      <p class="company">@freeCodeCamp</p>
      <hr />
      <p>Email: example@mail.com</p>
      <p>Phone: 123-123-4455</p>
      <a class="portfolio-link" href="#">Portfolio</a>
      <hr />
      <div class="social-media">
        <h2>Connect with me</h2>
        <a href="#">Twitter</a>
        <a href="#">LinkedIn</a>
        <a href="#">GitHub</a>
      </div>
    </div>
  </body>
</html>
