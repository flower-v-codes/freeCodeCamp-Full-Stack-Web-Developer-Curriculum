<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Styled To-Do List</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="todo-list-container">
      <h1>Daily Study Plan</h1>
      <ul class="todo-list">
        <li>
          <input type="checkbox" id="css" />
          <label for="css">Practice writing CSS</label>
          <ul class="sub-item">
            <li>
              <a class="sub-item-link" href="#" target="_blank">Open VS Code</a>
            </li>
          </ul>
        </li>
        <li>
          <input type="checkbox" id="article" />
          <label for="article">Read 2 web development articles</label>
          <ul class="sub-item">
            <li>
              <a class="sub-item-link" href="#" target="_blank"
                >Go to Smashing Magazine</a
              >
            </li>
          </ul>
        </li>
        <li>
          <input type="checkbox" id="notes" />
          <label for="notes">Finish writing HTML notes</label>
          <ul class="sub-item">
            <li>
              <a class="sub-item-link" href="#" target="_blank"
                >Write notes in the note taking app</a
              >
            </li>
          </ul>
        </li>
        <li>
          <input type="checkbox" id="freecodecamp" />
          <label for="freecodecamp">Do 1 lesson from freeCodeCamp</label>
          <ul class="sub-item">
            <li>
              <a class="sub-item-link" href="#" target="_blank"
                >Go to freeCodeCamp</a
              >
            </li>
          </ul>
        </li>
      </ul>
    </div>
  </body>
</html>
